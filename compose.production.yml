services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: liveschool
      POSTGRES_USER: liveschool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a PostgreSQL password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "liveschool", "-d", "liveschool"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Generate a Django secret}
      CERTIFICATE_SIGNING_KEY: ${CERTIFICATE_SIGNING_KEY:?Generate a separate certificate signing key}
      ALLOWED_HOSTS: ${SITE_DOMAIN:?Set your public hostname}
      CSRF_TRUSTED_ORIGINS: https://${SITE_DOMAIN}
      DATABASE_URL: postgresql://liveschool:${POSTGRES_PASSWORD}@db:5432/liveschool
      DATABASE_SSL_REQUIRE: "False"
      MEDIA_BUCKET: ${MEDIA_BUCKET:?Set the private media bucket}
      MEDIA_ACCESS_KEY_ID: ${MEDIA_ACCESS_KEY_ID:?Set the object storage access key}
      MEDIA_SECRET_ACCESS_KEY: ${MEDIA_SECRET_ACCESS_KEY:?Set the object storage secret key}
      MEDIA_ENDPOINT_URL: ${MEDIA_ENDPOINT_URL:-}
      MEDIA_REGION: ${MEDIA_REGION:-us-east-1}
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.jit.si}
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn --bind 0.0.0.0:8000 --access-logfile - liveschool_project.wsgi:application"]
    volumes:
      - media:/app/media

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set your public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - certificates:/data

volumes:
  database:
  media:
  certificates:
