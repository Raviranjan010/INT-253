{% extends 'base.html' %}
{% block title %}{{ heading }} | LiveSchool{% endblock %}
{% block content %}
<section class="ls-wrap ls-section">
  <a href="{% url 'courses:studio' course.slug %}">Back to course studio</a>
  <h1>{{ heading }}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn ls-primary" type="submit">Save</button>
  </form>
</section>
{% endblock %}
