<footer class="ls-footer">
  <div class="ls-wrap ls-footer-grid">
    <div><a class="ls-footer-brand" href="{% url 'core:home' %}">LiveSchool</a><p>Free Education for Everyone</p></div>
    <nav aria-label="Learning links">
      <h2>Learn</h2>
      <a href="{% url 'courses:course_list' %}">Explore courses</a>
      <a href="{% url 'live_classes:live_class_list' %}">Live classes</a>
      <a href="{% url 'community:forum_list' %}">Community resources</a>
      <a href="{% url 'certificates:verify' %}">Verify a certificate</a>
    </nav>
    <nav aria-label="About LiveSchool">
      <h2>LiveSchool</h2>
      <a href="{% url 'core:about' %}">About</a>
      <a href="{% url 'core:demographics_impact' %}">Access and inclusion</a>
      <a href="{% url 'core:contact' %}">Contact</a>
    </nav>
    <form method="post" action="{% url 'core:subscribe' %}">
      {% csrf_token %}
      <label for="footer-email">Learning updates</label>
      <div class="ls-newsletter"><input id="footer-email" type="email" name="email" autocomplete="email" required placeholder="Email address" class="form-control"><button class="btn ls-secondary" type="submit">Subscribe</button></div>
    </form>
  </div>
</footer>
