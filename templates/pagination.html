{% if page.has_other_pages %}
<nav class="ls-actions mt-4" aria-label="Results pages">
  {% if page.has_previous %}<a class="btn ls-secondary" href="{% querystring page=page.previous_page_number %}">Previous</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn ls-secondary" href="{% querystring page=page.next_page_number %}">Next</a>{% endif %}
</nav>
{% endif %}
